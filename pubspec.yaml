name: LumoRead
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  speech_to_text: ^6.3.0
  flutter_tts: ^3.6.3
  flutter_quiz_matcher: ^0.0.4
  http: ^1.2.2
  http_parser: ^4.0.2
  record: ^5.0.5
  intl: ^0.18.1
  audioplayers: ^5.2.1
  floating_bubbles: ^2.0.2
  animate_do: ^3.0.2
  shared_preferences: ^2.2.2
  bcrypt: ^1.1.3
  crypto: ^3.0.3 
  fl_chart: ^0.70.0
  google_fonts: ^6.1.0
  firebase_core: ^3.12.1 
  firebase_core_web: ^2.21.1
  firebase_auth: ^5.5.1 
  cloud_firestore: ^5.6.5  
  percent_indicator: ^4.2.2
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  cloud_firestore_web: ^4.4.5
  path_provider: ^2.1.3
  crypt: ^4.3.1
  firebase_storage: ^12.3.2
  flutter_lints: ^5.0.0
  image_picker: ^1.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Mali
      fonts:
        - asset: assets/fonts/Mali-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mali-Bold.ttf
          weight: 700
